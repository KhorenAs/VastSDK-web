# Every package's tests, the whole-repository typecheck, and every build — the
# packages and the demo — on every push and pull request. The build nobody runs
# is the one that breaks; VastSDK-apple learned that from a tvOS demo that stayed
# broken for a day because nothing built it.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
